name: Build and Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6031a7dff0d4a6469414cfa8a6dedddf
        run: |
          npx wrangler pages deploy dist \
            --project-name hypertask-docs \
            --branch main

      - name: Purge Cloudflare edge cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Pages promotion lags the upload; purging too early lets the edge
          # re-cache the previous deployment. Purge twice with a gap.
          sleep 60
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/2a45a3125cda94f854e5b163392dc76e/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{
              "files": [
                "https://docs.hypertask.ai/",
                "https://docs.hypertask.ai/changelog/",
                "https://docs.hypertask.ai/llms.txt",
                "https://docs.hypertask.ai/llms-full.txt",
                "https://docs.hypertask.ai/llms-small.txt",
                "https://docs.hypertask.ai/changelog.md"
              ]
            }'

      # Everything here pushes straight to main, so a failed deploy is the only
      # signal the site has stopped updating — and nobody watches the runs tab.
      # In July 2026 every deploy failed for eleven days before anyone noticed.
      # Raise one issue, and keep raising it until the build is green again.
      - name: Report a failed deploy
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          TITLE="docs.hypertask.ai is not deploying"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number -q '.[0].number')
          BODY="The docs site stopped updating. Until this is green, docs.hypertask.ai serves whatever was published last.

          Failed run: ${RUN_URL}
          Commit: ${COMMIT}

          Almost always malformed MDX: an unbalanced or bare JSX tag, an unescaped \`|\` inside a table cell, or an \`<Aside type=\"...\">\` that is not note/tip/caution/danger. Run \`npm run build\` locally to see the file and line."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
