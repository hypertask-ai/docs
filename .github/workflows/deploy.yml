name: Build and Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6031a7dff0d4a6469414cfa8a6dedddf
        run: |
          npx wrangler pages deploy dist \
            --project-name hypertask-docs \
            --branch main

      - name: Purge Cloudflare edge cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Pages promotion lags the upload; purging too early lets the edge
          # re-cache the previous deployment. Purge twice with a gap.
          sleep 60
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/2a45a3125cda94f854e5b163392dc76e/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{
              "files": [
                "https://docs.hypertask.ai/",
                "https://docs.hypertask.ai/changelog/",
                "https://docs.hypertask.ai/llms.txt",
                "https://docs.hypertask.ai/llms-full.txt",
                "https://docs.hypertask.ai/changelog.md"
              ]
            }'

      - name: Report a failed deploy
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          TITLE="docs.hypertask.ai is not deploying"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number -q '.[0].number')
          BODY="The docs site stopped updating. Until this is green, docs.hypertask.ai serves whatever was published last.

          Failed run: ${RUN_URL}
          Commit: ${COMMIT}

          Almost always malformed MDX: an unbalanced or bare JSX tag, an unescaped \`|\` inside a table cell, or an \`<Aside type=\"...\">\` that is not note/tip/caution/danger. Run \`npm run build\` locally to see the file and line."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Close recovered deploy alarm
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          HEAD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&per_page=1" --jq '.workflow_runs[0].head_sha')
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            exit 0
          fi
          ISSUES=$(gh issue list --state open --search '"docs.hypertask.ai is not deploying" in:title' \
            --json number,title --jq '.[] | select(.title == "docs.hypertask.ai is not deploying") | .number')
          while read -r ISSUE; do
            [ -n "$ISSUE" ] || continue
            gh issue close "$ISSUE" --comment "Deployment recovered. Build, Pages upload and cache purge succeeded for ${GITHUB_SHA}: ${RUN_URL}"
          done <<< "$ISSUES"
