name: Build Check

# The docs are written by agents editing MDX by hand, and a single malformed tag
# takes the whole site build down. Run the build wherever we can see it fail
# before it reaches the deploy job.

on:
  pull_request:
  # Agents push docs straight to main far more often than they open a PR, and
  # pull_request alone never fires on those. Both errors that took the site
  # down on 2026-08-06 arrived that way (HTPR-5110). Running on push means a
  # direct commit still fails loudly instead of silently blocking every deploy.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build the site
    runs-on: [self-hosted, contabo]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
